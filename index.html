<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Felipe's Blockbuster</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>

  <body>
    <div class="app-bg" aria-hidden="true"></div>

    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">F</span>
        <div class="brand-text">
          <h1 data-i18n="brandTitle">FELIPE'S BLOCKBUSTER</h1>
          <p class="tagline" data-i18n="tagline">
            Stream-style discovery & rentals
          </p>
        </div>
      </div>
      <div class="header-actions">
        <div
          class="lang-switch"
          role="group"
          aria-label="Language"
          data-i18n-aria="langGroupAria"
        >
          <button
            type="button"
            class="lang-btn"
            data-set-lang="en"
            data-i18n="langEn"
          >
            USA
          </button>
          <button
            type="button"
            class="lang-btn"
            data-set-lang="pt"
            data-i18n="langPt"
          >
            BRASIL
          </button>
        </div>
        <nav
          class="tabs"
          data-i18n-aria="tabsNavAria"
          aria-label="Content type"
        >
          <button type="button" data-tab="movies" data-i18n="tabMovies">
            Movies
          </button>
          <button type="button" data-tab="tv" data-i18n="tabTv">
            TV Shows
          </button>
          <button type="button" data-tab="cartoons" data-i18n="tabCartoons">
            Cartoons
          </button>
        </nav>
      </div>
    </header>

    <div class="layout">
      <main class="main">
        <div class="search-wrap">
          <label class="sr-only" for="search" data-i18n="searchLabel"
            >Search catalog</label
          >
          <span class="search-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </span>
          <input
            id="search"
            type="search"
            autocomplete="off"
            data-i18n-placeholder="searchPlaceholder"
            placeholder="Search titles, cast, genres…"
          />
        </div>

        <section class="browse-section" aria-labelledby="browse-heading">
          <div class="section-head">
            <h2
              id="browse-heading"
              class="section-title"
              data-i18n="nowAvailable"
            >
              Now Available!
            </h2>
            <p class="section-sub" id="browse-sub">New & notable releases</p>
          </div>
          <div id="grid" class="grid"></div>
        </section>
      </main>

      <aside class="panel right">
        <h2 class="panel-title" data-i18n="panelTop5">My Top 5</h2>
        <p class="panel-hint" data-i18n="panelTop5Hint">Rank your favorites</p>
        <div id="top" class="panel-list"></div>
        <p id="msg" class="panel-msg"></p>
      </aside>
    </div>

    <!-- Image Modal -->
    <div class="modal-overlay" id="modal" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button
          type="button"
          class="modal-close"
          id="modal-close"
          aria-label="Close"
        >
          ×
        </button>
        <div class="modal-carousel">
          <button
            type="button"
            class="carousel-arrow carousel-prev"
            id="carousel-prev"
            aria-label="Previous image"
          >
            ‹
          </button>
          <div class="carousel-stage">
            <div class="carousel-loading" id="carousel-loading">
              Loading images...
            </div>
            <div class="carousel-error" id="carousel-error" hidden>
              Couldn't load images
            </div>
            <img id="carousel-img" alt="" hidden />
            <p class="carousel-count" id="carousel-count" hidden></p>
          </div>
          <button
            type="button"
            class="carousel-arrow carousel-next"
            id="carousel-next"
            aria-label="Next image"
          >
            ›
          </button>
        </div>
        <div class="modal-info">
          <h2 id="modal-title"></h2>
          <p class="modal-meta" id="modal-meta"></p>
          <div class="modal-actions">
            <button type="button" class="btn btn-top3" id="modal-add">
              Top 5
            </button>
            <button type="button" class="btn btn-remove" id="modal-remove">
              Remove from Top 5
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
